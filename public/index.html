<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dialogos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Doto:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <header id="header">
      <div class="header-left">
        <span class="logo">dialogos</span>
      </div>
      <div class="header-right">
        <button id="theme-toggle" class="icon-btn" title="Toggle theme">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="4" stroke="currentColor" stroke-width="1.5"/>
            <path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <button id="settings-btn" class="icon-btn" title="Settings">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M8 1v2M8 13v2M1 8h2M13 8h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <button id="clear-btn" class="icon-btn" title="Clear chat">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </header>

    <main id="main">
      <div id="chat-container">
        <div id="avatar-panel">
          <div id="avatar-frame">
            <div id="avatar-placeholder">
              <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                <circle cx="24" cy="20" r="8" stroke="currentColor" stroke-width="2"/>
                <path d="M10 42c0-7.73 6.27-14 14-14s14 6.27 14 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </div>
          </div>
        </div>
        <div id="messages-panel">
          <div id="messages"></div>
        </div>
      </div>
    </main>

    <footer id="footer">
      <form id="chat-form">
        <select id="model-selector" title="Select model"></select>
        <input type="text" id="chat-input" placeholder="message..." autocomplete="off" />
        <button type="submit" id="send-btn">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M2 8h12M10 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </form>
    </footer>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <div class="modal-header">
          <span>settings</span>
          <button id="settings-close" class="icon-btn">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <!-- Tabs -->
          <div class="settings-tabs">
            <button class="settings-tab active" data-tab="general">general</button>
            <button class="settings-tab" data-tab="providers">providers</button>
            <button class="settings-tab" data-tab="models">models</button>
          </div>

          <!-- General Tab -->
          <div class="settings-tab-content active" data-tab="general">
            <div class="setting-group">
              <label for="system-prompt">system prompt</label>
              <textarea id="system-prompt" rows="4" placeholder="You are a helpful assistant."></textarea>
              <button id="save-prompt-btn" class="btn">save</button>
            </div>
            <div class="setting-group">
              <label>font</label>
              <div class="font-selector">
                <button class="font-option active" data-font="doto">Doto</button>
                <button class="font-option" data-font="bebas">Bebas Neue</button>
              </div>
            </div>
            <div class="setting-group">
              <label>avatar</label>
              <div id="avatar-preview-container">
                <div id="avatar-preview"></div>
              </div>
              <div class="avatar-actions">
                <label for="avatar-upload" class="btn">upload</label>
                <input type="file" id="avatar-upload" accept="image/*,video/mp4,video/webm" hidden />
                <button id="remove-avatar-btn" class="btn btn-danger">remove</button>
              </div>
            </div>
          </div>

          <!-- Providers Tab -->
          <div class="settings-tab-content" data-tab="providers">

            <div class="provider-section" data-provider="anthropic">
              <div class="provider-header">
                <span class="provider-name">anthropic</span>
                <span class="provider-status" id="anthropic-status"></span>
              </div>
              <div class="setting-group">
                <label>api key</label>
                <input type="password" class="setting-input provider-api-key" data-provider="anthropic" placeholder="sk-ant-..." />
                <div class="key-status" id="anthropic-key-status"></div>
              </div>
              <div class="setting-group">
                <label>api endpoint</label>
                <input type="text" class="setting-input provider-base-url" data-provider="anthropic" placeholder="https://api.anthropic.com" />
              </div>
              <div class="provider-actions">
                <button class="btn save-provider-btn" data-provider="anthropic">save</button>
                <button class="btn test-provider-btn" data-provider="anthropic">test</button>
                <span class="test-result" id="anthropic-test-result"></span>
              </div>
            </div>

            <div class="provider-section" data-provider="openai">
              <div class="provider-header">
                <span class="provider-name">openai</span>
                <span class="provider-status" id="openai-status"></span>
              </div>
              <div class="setting-group">
                <label>api key</label>
                <input type="password" class="setting-input provider-api-key" data-provider="openai" placeholder="sk-..." />
                <div class="key-status" id="openai-key-status"></div>
              </div>
              <div class="setting-group">
                <label>api endpoint</label>
                <input type="text" class="setting-input provider-base-url" data-provider="openai" placeholder="https://api.openai.com/v1" />
              </div>
              <div class="provider-actions">
                <button class="btn save-provider-btn" data-provider="openai">save</button>
                <button class="btn test-provider-btn" data-provider="openai">test</button>
                <span class="test-result" id="openai-test-result"></span>
              </div>
            </div>

            <div class="provider-section" data-provider="gemini">
              <div class="provider-header">
                <span class="provider-name">gemini</span>
                <span class="provider-status" id="gemini-status"></span>
              </div>
              <div class="setting-group">
                <label>api key</label>
                <input type="password" class="setting-input provider-api-key" data-provider="gemini" placeholder="AIza..." />
                <div class="key-status" id="gemini-key-status"></div>
              </div>
              <div class="setting-group">
                <label>api endpoint</label>
                <input type="text" class="setting-input provider-base-url" data-provider="gemini" placeholder="https://generativelanguage.googleapis.com" />
              </div>
              <div class="provider-actions">
                <button class="btn save-provider-btn" data-provider="gemini">save</button>
                <button class="btn test-provider-btn" data-provider="gemini">test</button>
                <span class="test-result" id="gemini-test-result"></span>
              </div>
            </div>

            <div class="provider-section" data-provider="ollama">
              <div class="provider-header">
                <span class="provider-name">ollama</span>
                <span class="provider-status" id="ollama-status"></span>
              </div>
              <div class="setting-group">
                <label>api key <span class="label-hint">(optional)</span></label>
                <input type="password" class="setting-input provider-api-key" data-provider="ollama" placeholder="(not required for local)" />
                <div class="key-status" id="ollama-key-status"></div>
              </div>
              <div class="setting-group">
                <label>api endpoint</label>
                <input type="text" class="setting-input provider-base-url" data-provider="ollama" placeholder="http://localhost:11434" />
              </div>
              <div class="provider-actions">
                <button class="btn save-provider-btn" data-provider="ollama">save</button>
                <button class="btn test-provider-btn" data-provider="ollama">test</button>
                <span class="test-result" id="ollama-test-result"></span>
              </div>
            </div>

          </div>

          <!-- Models Tab -->
          <div class="settings-tab-content" data-tab="models">
            <div class="setting-group">
              <div class="models-description">select models to enable in the chat selector</div>
              <div id="models-list"></div>
              <button class="btn" id="save-models-btn">save</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
