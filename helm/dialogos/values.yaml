replicaCount: 1

image:
  repository: ghcr.io/OWNER/dialogos-alt
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: dialogos.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

persistence:
  enabled: true
  size: 1Gi
  storageClass: ""
  accessMode: ReadWriteOnce

env:
  HOST: "0.0.0.0"
  PORT: "3000"
  DATA_DIR: "/app/data"
  OLLAMA_BASE_URL: "http://localhost:11434"

secrets:
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  GEMINI_API_KEY: ""

nodeSelector: {}
tolerations: []
affinity: {}
