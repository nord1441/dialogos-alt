apiVersion: apps/v1
kind: Deployment
metadata:
  name: dialogos
  namespace: dialogos
  labels:
    app: dialogos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dialogos
  template:
    metadata:
      labels:
        app: dialogos
    spec:
      containers:
        - name: dialogos
          image: ghcr.io/OWNER/dialogos-alt:latest
          ports:
            - containerPort: 3000
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
            - name: DATA_DIR
              value: "/app/data"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dialogos-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dialogos-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dialogos-secrets
                  key: GEMINI_API_KEY
                  optional: true
            - name: OLLAMA_BASE_URL
              value: "http://localhost:11434"
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dialogos-data
